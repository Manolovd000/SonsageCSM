name: Keep Streamlit alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit app
        run: |
          curl -L --fail --max-time 60 \
          "https://sonsagecsm-jayc6ngmmn7ddh2azigt3q.streamlit.app/?keepalive=1"
